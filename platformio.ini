[platformio]
default_envs = esp8266

; Main ESP8266 environment
[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino

; Let PlatformIO use default compatible ESP8266 core version
; (v2.2.0 constraint removed - not available in modern PlatformIO registry)

; OTA_PASSWORD (required by src/AquaControl.cpp) comes from the git-ignored
; secrets.ini via scripts/load_secrets.py - same hook as env:esp8266_ota.
extra_scripts = pre:scripts/load_secrets.py

; Development build flags
build_flags =
    -D CORE_DEBUG_LEVEL=5
    -D DEBUG_ESP_PORT=Serial

; USB upload settings (first time setup)
upload_speed = 921600
monitor_speed = 19200

; Libraries (using latest compatible versions)
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library
    paulstoffregen/Time
    jchristensen/DS3232RTC
    paulstoffregen/OneWire

; OTA (Over-The-Air) upload environment
[env:esp8266_ota]
extends = env:esp8266
extra_scripts = pre:scripts/load_secrets.py
build_flags =
    ${env:esp8266.build_flags}
    -D USE_OTA_SERIAL
    -D OTA_SERIAL_BUFFER_LEN=1024

monitor_port = socket://SBAQC.local:23

; Upload via WiFi instead of USB
upload_protocol = espota
upload_port = 192.168.103.8


; Test environment (runs on PC, no hardware needed)
; Approach 2 of GitHub issue #10: src/ cannot
; compile on the host (Arduino/ESP8266/SD/TimeLib headers), so env:test
; excludes it and builds only the dependency-free mirror + Unity tests
; under test/. `pio test -e test` builds and runs them headless
; (plain `pio run -e test` reports "nothing to build" by design - src/ is
; firmware-only and test sources are built by the test runner, not `run`).
[env:test]
platform = native
test_framework = unity
build_src_filter =
    -<*>
build_flags =
    -D UNIT_TEST
    -std=c++11
    -I test/support
